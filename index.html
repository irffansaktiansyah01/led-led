<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol IoT Jarak Jauh via MQTT</title>
    <!-- Memanggil Library MQTT.js agar Browser bisa pakai MQTT -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; padding: 10px; background-color: #f4f4f9; }
        h2 { color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; margin-bottom: 15px; text-align: center; }
        
        /* Gaya Lampu Indikator */
        .indicator-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 15px 0; font-weight: bold; font-size: 18px; }
        .indicator-dot { width: 24px; height: 24px; border-radius: 50%; background-color: #7f8c8d; display: inline-block; box-shadow: 0 0 8px rgba(0,0,0,0.2); transition: background-color 0.3s ease, box-shadow 0.3s ease; }
        
        /* Warna Status Indikator */
        .status-on { background-color: #28a745; box-shadow: 0 0 15px #28a745; }
        .status-off { background-color: #dc3545; box-shadow: 0 0 15px #dc3545; }

        .btn { display: inline-block; width: 46%; padding: 14px; margin: 5px 2%; font-size: 16px; font-weight: bold; text-align: center; text-decoration: none; border-radius: 5px; color: white; cursor: pointer; border: none; }
        .btn-on { background-color: #28a745; }
        .btn-off { background-color: #dc3545; }
        .btn:hover { opacity: 0.9; }
        .status-box { padding: 15px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; text-align: center; background-color: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🌐 Kontrol Jarak Jauh (MQTT)</h2>
        <hr>
        
        <!-- INDIKATOR LAMPU VISUAL -->
        <div class="indicator-container">
            <span id="lamp-dot" class="indicator-dot"></span>
            <span id="lamp-text">STATUS: MEMBUKA KONEKSI...</span>
        </div>

        <div class="status-box" id="status-display">Menghubungkan ke Broker HiveMQ...</div>
        
        <div style="text-align: center;">
            <button onclick="kirimPerintah('ON')" class="btn btn-on" id="btn-nyala" disabled>NYALAKAN</button>
            <button onclick="kirimPerintah('OFF')" class="btn btn-off" id="btn-mati" disabled>MATIKAN</button>
        </div>
    </div>

    <script>
        const topik = "nepanled1";
        // Menggunakan WebSockets port 8000 untuk HiveMQ Public Broker
        const brokerUrl = "wss://broker.hivemq.com:8884/mqtt"; 
        
        // Membuat ID unik untuk browser klien
        const clientId = "client_gh_" + Math.random().toString(16).substr(2, 8);
        
        // Mulai koneksi ke Broker HiveMQ
        const client = mqtt.connect(brokerUrl, { clientId: clientId });

        const dotElement = document.getElementById('lamp-dot');
        const textElement = document.getElementById('lamp-text');
        const statusDisplay = document.getElementById('status-display');

        // Ketika web berhasil terhubung ke HiveMQ
        client.on('connect', () => {
            statusDisplay.innerText = "Terhubung ke Internet (HiveMQ)!";
            statusDisplay.style.backgroundColor = "#d4edda";
            statusDisplay.style.color = "#155724";
            
            // Aktifkan tombol kontrol
            document.getElementById('btn-nyala').disabled = false;
            document.getElementById('btn-mati').disabled = false;
            
            // Set tampilan awal menjadi OFF sebelum ada aksi
            dotElement.className = 'indicator-dot status-off';
            textElement.innerText = "STATUS: OFF";
            textElement.style.color = "#dc3545";
        });

        // Jika koneksi terputus
        client.on('error', (err) => {
            statusDisplay.innerText = "Gagal terhubung ke Broker!";
            statusDisplay.style.backgroundColor = "#f8d7da";
            statusDisplay.style.color = "#721c24";
            console.error(err);
        });

        // Fungsi mengirim data ke ESP8266 lewat MQTT
        function kirimPerintah(perintah) {
            if (client.connected) {
                // Publish pesan ke topik nepanled1
                client.publish(topik, perintah, { qos: 0, retain: false }, (err) => {
                    if (!err) {
                        statusDisplay.innerText = `Perintah ${perintah} Terkirim Jarak Jauh!`;
                        
                        if (perintah === 'ON') {
                            dotElement.className = 'indicator-dot status-on';
                            textElement.innerText = "STATUS: ON";
                            textElement.style.color = "#28a745";
                        } else {
                            dotElement.className = 'indicator-dot status-off';
                            textElement.innerText = "STATUS: OFF";
                            textElement.style.color = "#dc3545";
                        }
                    } else {
                        statusDisplay.innerText = "Gagal mengirim perintah.";
                    }
                });
            } else {
                statusDisplay.innerText = "Koneksi terputus, tidak bisa kirim perintah.";
            }
        }
    </script>
</body>
</html>
