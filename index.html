<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Jarak Jauh + 4 Timer (Saved State)</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; padding: 10px; background-color: #f4f4f9; }
        h2, h3 { color: #333; margin: 5px 0; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 440px; margin: auto; margin-bottom: 15px; text-align: center; }
        .clock-box { font-size: 28px; font-weight: bold; color: #2c3e50; background: #eec; padding: 10px; border-radius: 6px; margin: 10px 0; font-family: 'Courier New', Courier, monospace; border: 2px solid #bdc3c7; }
        .date-box { font-size: 14px; color: #7f8c8d; margin-bottom: 15px; }
        .indicator-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 15px 0; font-weight: bold; font-size: 18px; }
        .indicator-dot { width: 24px; height: 24px; border-radius: 50%; background-color: #7f8c8d; display: inline-block; box-shadow: 0 0 8px rgba(0,0,0,0.2); transition: background-color 0.3s ease, box-shadow 0.3s ease; }
        .status-on { background-color: #28a745; box-shadow: 0 0 15px #28a745; }
        .status-off { background-color: #dc3545; box-shadow: 0 0 15px #dc3545; }
        .btn { display: inline-block; width: 46%; padding: 14px; margin: 5px 2%; font-size: 16px; font-weight: bold; text-align: center; text-decoration: none; border-radius: 5px; color: white; cursor: pointer; border: none; }
        .btn-on { background-color: #28a745; }
        .btn-off { background-color: #dc3545; }
        .btn-submit { background-color: #007bff; width: 96%; margin-top: 15px; }
        .btn:hover { opacity: 0.9; }
        .status-box { padding: 15px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; text-align: center; background-color: #e2e3e5; color: #383d41; }
        
        .timer-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; padding: 8px; background: #f8f9fa; border-radius: 4px; border-left: 4px solid #007bff; }
        .timer-row span { font-weight: bold; font-size: 14px; }
        .timer-row input[type="time"] { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- KARTU 1: MANUAL & MONITOR -->
    <div class="card">
        <h2>🌐 Kontrol Jarak Jauh (MQTT)</h2>
        <div class="clock-box" id="live-clock">00:00:00</div>
        <div class="date-box" id="live-date">Memuat tanggal...</div>
        <hr>
        
        <div class="indicator-container">
            <span id="lamp-dot" class="indicator-dot"></span>
            <span id="lamp-text">STATUS: SINKRONISASI...</span>
        </div>

        <div class="status-box" id="status-display">Menghubungkan ke Broker HiveMQ...</div>
        
        <div style="text-align: center;">
            <button onclick="kirimPerintah('ON')" class="btn btn-on" id="btn-nyala" disabled>NYALAKAN</button>
            <button onclick="kirimPerintah('OFF')" class="btn btn-off" id="btn-mati" disabled>MATIKAN</button>
        </div>
    </div>

    <!-- KARTU 2: SETINGAN JADWAL (NILAI TETAP MEMBEKU / DIINGAT) -->
    <div class="card">
        <h3>⚙️ Pengaturan 4 Set Jadwal Lampu</h3>
        <p style="font-size: 12px; color: #666; margin-top: 0;">Waktu otomatis tersimpan aman di browser Anda</p>
        <hr>
        
        <form id="timer-form" onsubmit="simpanJadwal(event)">
            <div class="timer-row">
                <span>Set 1</span>
                <label>ON: <input type="time" id="on1"></label>
                <label>OFF: <input type="time" id="off1"></label>
            </div>
            <div class="timer-row">
                <span>Set 2</span>
                <label>ON: <input type="time" id="on2"></label>
                <label>OFF: <input type="time" id="off2"></label>
            </div>
            <div class="timer-row">
                <span>Set 3</span>
                <label>ON: <input type="time" id="on3"></label>
                <label>OFF: <input type="time" id="off3"></label>
            </div>
            <div class="timer-row">
                <span>Set 4</span>
                <label>ON: <input type="time" id="on4"></label>
                <label>OFF: <input type="time" id="off4"></label>
            </div>
            
            <button type="submit" class="btn btn-submit" id="btn-save" disabled>💾 Simpan Semua Jadwal</button>
        </form>
    </div>

    <script>
        // --- JAM DIGITAL ---
        function updateJam() {
            const sekarang = new Date();
            const jam = String(sekarang.getHours()).padStart(2, '0');
            const menit = String(sekarang.getMinutes()).padStart(2, '0');
            const detik = String(sekarang.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').innerText = `${jam}:${menit}:${detik}`;
            const opsi = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('live-date').innerText = sekarang.toLocaleDateString('id-ID', opsi);
        }
        setInterval(updateJam, 1000);
        updateJam();

        // --- FUNGSI UTAMAKAN MEMBACA MEMORI LOKAL BROWSER ---
        function muatJadwalTersimpan() {
            for(let i = 1; i <= 4; i++) {
                if(localStorage.getItem(`on${i}`)) {
                    document.getElementById(`on${i}`).value = localStorage.getItem(`on${i}`);
                }
                if(localStorage.getItem(`off${i}`)) {
                    document.getElementById(`off${i}`).value = localStorage.getItem(`off${i}`);
                }
            }
        }
        // Panggil fungsi muat waktu saat halaman pertama kali dibuka sebelum MQTT connect
        muatJadwalTersimpan();

        // --- MQTT CONFIG ---
        const topikKontrol = "nepanled1";
        const topikStatus = "nepanled1/status"; 
        const brokerUrl = "wss://broker.hivemq.com:8884/mqtt"; 
        
        const clientId = "client_gh_" + Math.random().toString(16).substr(2, 8);
        const client = mqtt.connect(brokerUrl, { clientId: clientId });

        const dotElement = document.getElementById('lamp-dot');
        const textElement = document.getElementById('lamp-text');
        const statusDisplay = document.getElementById('status-display');

        client.on('connect', () => {
            statusDisplay.innerText = "Terhubung! Menyinkronkan alat...";
            statusDisplay.style.backgroundColor = "#d1ecf1";
            statusDisplay.style.color = "#0c5460";
            
            document.getElementById('btn-nyala').disabled = false;
            document.getElementById('btn-mati').disabled = false;
            document.getElementById('btn-save').disabled = false;
            
            client.subscribe(topikStatus);
            client.publish(topikKontrol, "STATUS_REQ"); 
        });

        client.on('message', (topic, message) => {
            if (topic === topikStatus) {
                const statusAlat = message.toString();
                const jamSekarang = document.getElementById('live-clock').innerText;
                
                if (statusAlat === 'ON') {
                    dotElement.className = 'indicator-dot status-on';
                    textElement.innerText = "STATUS: ON";
                    textElement.style.color = "#28a745";
                    statusDisplay.innerText = `Lampu Menyala (Jam ${jamSekarang})`;
                    statusDisplay.style.backgroundColor = "#d4edda";
                    statusDisplay.style.color = "#155724";
                } else if (statusAlat === 'OFF') {
                    dotElement.className = 'indicator-dot status-off';
                    textElement.innerText = "STATUS: OFF";
                    textElement.style.color = "#dc3545";
                    statusDisplay.innerText = `Lampu Mati (Jam ${jamSekarang})`;
                    statusDisplay.style.backgroundColor = "#f8d7da";
                    statusDisplay.style.color = "#721c24";
                }
            }
        });

        function kirimPerintah(perintah) {
            if (client.connected) {
                statusDisplay.innerText = "Memproses perintah manual...";
                client.publish(topikKontrol, perintah);
            }
        }

        // --- SIMPAN JADWAL KE HARDDISK BROWSER & KIRIM MQTT ---
        function simpanJadwal(event) {
            event.preventDefault();
            if (!client.connected) {
                alert("Gagal, koneksi internet terputus!");
                return;
            }

            let dataJadwal = "JADWAL";
            for(let i = 1; i <= 4; i++) {
                let waktuOn = document.getElementById(`on${i}`).value || "--:--";
                let waktuOff = document.getElementById(`off${i}`).value || "--:--";
                dataJadwal += `|${waktuOn}|${waktuOff}`;

                // Proses simpan permanen di browser internet user
                localStorage.setItem(`on${i}`, waktuOn);
                localStorage.setItem(`off${i}`, waktuOff);
            }

            // Publish dengan parameter { retain: true } agar broker MQTT menyimpan salinan jadwal terakhir
            client.publish(topikKontrol, dataJadwal, { qos: 1, retain: true });
            
            statusDisplay.innerText = "Jadwal Disimpan Permanen & Dikirim!";
            statusDisplay.style.backgroundColor = "#d4edda";
            statusDisplay.style.color = "#155724";
        }
    </script>
</body>
</html>
