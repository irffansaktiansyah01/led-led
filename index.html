<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol IoT via GitHub Pages</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; padding: 10px; background-color: #f4f4f9; }
        h2 { color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; margin-bottom: 15px; }
        .btn { display: inline-block; width: 46%; padding: 14px; margin: 5px 2%; font-size: 16px; font-weight: bold; text-align: center; text-decoration: none; border-radius: 5px; color: white; cursor: pointer; border: none; }
        .btn-on { background-color: #28a745; }
        .btn-off { background-color: #dc3545; }
        .btn:hover { opacity: 0.9; }
        .status-box { padding: 15px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; text-align: center; background-color: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>

    <!-- KARTU KONTROL LAMPU -->
    <div class="card">
        <h2>💡 Kontrol Lampu (via GitHub)</h2>
        <hr>
        <div class="status-box" id="status-display">Mengirim perintah langsung ke alat...</div>
        
        <div style="text-align: center;">
            <!-- PENTING: Ganti IP_ESP8266_KAMU dengan IP asli ESP8266 Anda -->
            <button onclick="kontrolLampu('http://IP_ESP8266_KAMU/led/on')" class="btn btn-on">NYALAKAN</button>
            <button onclick="kontrolLampu('http://IP_ESP8266_KAMU/led/off')" class="btn btn-off">MATIKAN</button>
        </div>
    </div>

    <script>
        function kontrolLampu(url Aksi) {
            document.getElementById('status-display').innerText = "Memproses...";
            
            // Menggunakan JavaScript Fetch untuk menembak IP ESP8266 secara background
            fetch(urlAksi, { mode: 'no-cors' })
            .then(() => {
                document.getElementById('status-display').innerText = "Perintah Berhasil Dikirim!";
                document.getElementById('status-display').style.backgroundColor = "#d4edda";
                document.getElementById('status-display').style.color = "#155724";
            })
            .catch(err => {
                document.getElementById('status-display').innerText = "Gagal Terhubung ke ESP8266";
                document.getElementById('status-display').style.backgroundColor = "#f8d7da";
                document.getElementById('status-display').style.color = "#721c24";
            });
        }
    </script>
</body>
</html>
